<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box-Model</title>
    <style>
        #caixa1 {
            border: 3px solid red;
            width: 204px;
            height: 204px;
            padding: 3px;
        }

        #caixa2 {
            border: 3px solid green;
            width: 194px;
            height: 194px;
            padding: 4px 0px 0px 4px;
        }

    </style>
</head>
<body>
    <div id="caixa1">
        <div id="caixa2">

        </div>
    </div>
    
</body>
</html>
